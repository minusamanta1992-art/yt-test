<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Network</title>
<meta name="theme-color" content="#050807"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#34d399;--ac2:#f2b45a;--bg:#050807;--tx:#eaf2ee;--mut:#9db1a6;--bd:rgba(255,255,255,.1);--gl:rgba(10,18,15,.55);--e:cubic-bezier(.2,.8,.2,1);--fb:radial-gradient(120% 70% at 50% 100%,#12331f,transparent 60%),radial-gradient(70% 50% at 70% 15%,#1b2c24,transparent);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font:400 16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}body.loading{overflow:hidden}
h1,h2,h3,.btn,.brand,.num{font-family:Sora,Inter,sans-serif}a{color:inherit}
:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
#bg,#shade,.fog,#fx,#bolt{position:fixed;inset:0;pointer-events:none}
#bg{background-color:var(--bg);inset:-4%;z-index:-6;background-size:cover;background-position:center;transform:scale(1.3);filter:blur(18px) brightness(.45);translate:var(--px,0) var(--py,0);transition:transform 3s var(--e),filter 2.6s,translate .7s ease-out}
body.ready #bg{transform:scale(1.05);filter:brightness(.62)}body.zap #bg{filter:brightness(1.1)}
#shade{z-index:-5;background:radial-gradient(ellipse at 50% 35%,transparent 20%,rgba(0,0,0,.8)),linear-gradient(#050807d9,transparent 25%,transparent 50%,#050807f5)}
.fog{z-index:-4;opacity:.55;background:radial-gradient(60% 28% at 20% 82%,rgba(205,235,220,.14),transparent),radial-gradient(50% 24% at 78% 68%,rgba(205,235,220,.1),transparent);animation:drift 45s linear infinite alternate}.f2{animation-duration:75s;animation-direction:alternate-reverse;opacity:.4;scale:-1 1}
@keyframes drift{to{transform:translateX(9%)}}
#fx{z-index:-3;width:100%;height:100%}
#bolt{z-index:-2;opacity:0;background:radial-gradient(ellipse at var(--bx,50%) 0,rgba(190,220,255,.5),transparent 65%)}#bolt.go{animation:flash 1.2s}#bolt svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes flash{0%{opacity:0}6%{opacity:1}14%{opacity:.15}22%{opacity:.9}60%{opacity:.2}100%{opacity:0}}
#intro{position:fixed;inset:0;z-index:99;pointer-events:none}#intro i.p{position:absolute;left:0;right:0;height:50.5%;background:#030605;transition:transform 1.1s .25s var(--e)}.p1{top:0}.p2{bottom:0}
#intro .mid{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .5s}
body.ready .p1{transform:translateY(-101%)}body.ready .p2{transform:translateY(101%)}body.ready #intro .mid{opacity:0}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;position:relative;animation:pop 1.2s var(--e) both}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--bd);border-top-color:var(--ac);animation:spin 1.3s linear infinite;box-shadow:0 0 44px -8px var(--ac)}.ring img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 18px var(--ac))}
.pct{font:600 13px Sora;color:var(--mut);letter-spacing:.1em}.pbar{width:200px;height:2px;background:var(--bd);overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transform-origin:left;transform:scaleX(0)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{from{opacity:0;scale:.7}}
#cur{position:fixed;z-index:90;left:0;top:0;width:34px;height:34px;margin:-17px;border:1.5px solid var(--ac);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s,width .2s,height .2s,margin .2s,background .2s;box-shadow:0 0 18px -4px var(--ac)}#cur.on{opacity:.9}#cur.h{width:56px;height:56px;margin:-28px;background:color-mix(in srgb,var(--ac) 14%,transparent)}
@media(hover:hover)and(pointer:fine){body.cc,body.cc a,body.cc button,body.cc summary{cursor:none}}
header{position:fixed;top:14px;left:50%;z-index:50;width:min(1180px,94vw);display:flex;align-items:center;gap:22px;padding:10px 12px 10px 18px;border:1px solid var(--bd);border-radius:16px;background:rgba(8,14,12,.5);backdrop-filter:blur(18px) saturate(150%);translate:-50% -100px;opacity:0;transition:translate 1s .6s var(--e),opacity 1s .6s}body.ready header{translate:-50% 0;opacity:1}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;margin-right:auto}.brand img{height:32px;width:32px;object-fit:contain}
nav{display:flex;gap:4px}nav a{color:var(--mut);text-decoration:none;font-size:14px;padding:8px 14px;border-radius:9px;transition:.2s}nav a:hover,nav a.on{color:var(--tx);background:rgba(255,255,255,.06)}nav .soon{opacity:.45;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}.btn.s{background:linear-gradient(120deg,var(--ac),color-mix(in srgb,var(--ac) 70%,var(--ac2)));border-color:transparent;color:#04100a}.btn.s:hover{box-shadow:0 12px 40px -10px var(--ac)}
main,footer{position:relative;width:min(1180px,92vw);margin:auto}footer{width:100%}
.hero{min-height:100svh;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;padding:110px 0 70px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 16px 7px 12px;border:1px solid var(--bd);border-radius:99px;background:var(--gl);backdrop-filter:blur(10px);font-size:14px;color:var(--mut);margin-bottom:22px}
.dot{width:9px;height:9px;border-radius:50%;background:#6b7a72;position:relative}.on .dot,.dot.on{background:#3ddc84}.dot.on:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #3ddc84;animation:pl 1.8s ease-out infinite}.dot.off{background:#f87171}@keyframes pl{0%{scale:.5;opacity:.9}100%{scale:1.8;opacity:0}}
h1{font-weight:800;font-size:clamp(3.4rem,9vw,7.2rem);line-height:.96;letter-spacing:-.04em;margin-bottom:22px;text-shadow:0 8px 60px rgba(0,0,0,.6)}h1 .w{display:inline-block;margin-right:.22em}
h1 .ch{display:inline-block;opacity:0;translate:0 70%;filter:blur(10px)}body.ready h1 .ch{animation:rise .9s calc(1s + var(--i)*65ms) var(--e) forwards}@keyframes rise{to{opacity:1;translate:0 0;filter:blur(0)}}
.lead{font:600 1.25rem Sora;color:var(--ac2);margin-bottom:10px}.desc{color:var(--mut);max-width:50ch;font-size:1.08rem}
.hero .in>*{opacity:0;translate:0 20px;transition:opacity .9s,translate .9s var(--e)}body.ready .hero .in>*{opacity:1;translate:0 0}
.ipbox{display:flex;max-width:470px;margin:30px 0 14px;border:1px solid var(--bd);border-radius:14px;background:var(--gl);backdrop-filter:blur(12px);overflow:hidden}.ipbox code{flex:1;padding:15px 20px;font:600 1.02rem Sora;align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ipbox button{border:0;border-radius:0;min-height:54px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.sub{color:var(--mut);font-size:14px;margin-bottom:22px}.sub b{color:var(--tx);cursor:pointer;font-weight:600}
.card{position:relative;border:1px solid var(--bd);border-radius:22px;background:linear-gradient(150deg,rgba(18,30,25,.7),rgba(8,14,12,.6));backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 80px -20px rgba(0,0,0,.7);overflow:hidden;transition:border-color .3s,transform .2s ease-out}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%)}.card:hover:before{opacity:1}.card:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.live{padding:30px;display:grid;gap:18px;transform-style:preserve-3d}.live:after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.lh{display:flex;align-items:center;gap:18px}.lh img{width:84px;height:84px;border-radius:18px;object-fit:contain;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--ac) 55%,transparent))}@keyframes fl{50%{translate:0 -9px}}
.num{font-weight:700;font-size:clamp(2.6rem,5vw,3.8rem);line-height:1;font-variant-numeric:tabular-nums}.num span{color:var(--mut);font-size:.55em}.cap{color:var(--mut);font-size:14px}
.cb{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}.cb i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1.4s var(--e)}
.motd{padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.45);border:1px solid var(--bd);font:500 13px/1.5 ui-monospace,Menlo,monospace;color:#b7c4bd;text-align:center}.who{display:flex;flex-wrap:wrap;gap:6px}.who span{font-size:12px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent)}
.sec{padding:100px 0}.sec>*{opacity:0;translate:0 30px;transition:opacity .9s,translate .9s var(--e)}.sec.v>*{opacity:1;translate:0 0}.sec.v>*:nth-child(2){transition-delay:.12s}.sec.v>*:nth-child(3){transition-delay:.22s}
h2{font-size:clamp(2rem,4.4vw,3.2rem);letter-spacing:-.025em;line-height:1.1;margin-bottom:10px}.sh{color:var(--mut);max-width:52ch;margin-bottom:44px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.mode{padding:28px 24px 30px;display:flex;flex-direction:column;gap:10px;min-height:250px}.mode:hover{translate:0 -6px}.mode h3{font-size:1.35rem;position:relative}.mode p{color:var(--mut);position:relative;flex:1}
.ic{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);position:relative;margin-bottom:10px}.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;color:var(--ac2);border:1px solid color-mix(in srgb,var(--ac2) 35%,transparent);position:relative}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feat{padding:28px}.feat.wide{grid-column:span 2}.feat h3{font-size:1.2rem;margin-bottom:6px;position:relative}.feat p{color:var(--mut);position:relative;max-width:46ch}
.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--bd);border-radius:14px;background:var(--gl);margin-bottom:26px}.tabs button{border:0;background:none;color:var(--mut);padding:10px 22px;border-radius:10px;font:600 14px Sora;cursor:pointer;transition:.25s}.tabs .on{background:var(--ac);color:#04100a}
ol{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}ol li{counter-increment:s;padding:22px;border:1px solid var(--bd);border-radius:16px;background:var(--gl);backdrop-filter:blur(12px);color:var(--mut);animation:up .5s both}ol li:before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;margin-bottom:14px;border-radius:50%;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font:700 15px Sora}ol code{color:var(--ac2);cursor:pointer;font-weight:600}@keyframes up{from{opacity:0;translate:0 14px}}
.faq{display:grid;gap:12px;max-width:820px}details{border:1px solid var(--bd);border-radius:14px;background:var(--gl);backdrop-filter:blur(12px);transition:border-color .25s}details:hover,details[open]{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 22px;font:600 1.02rem Sora;cursor:pointer}summary::-webkit-details-marker{display:none}summary:after{content:"";width:9px;height:9px;border-right:2px solid var(--ac);border-bottom:2px solid var(--ac);rotate:45deg;transition:rotate .3s var(--e)}details[open] summary:after{rotate:225deg}
.aw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--e)}details[open] .aw{grid-template-rows:1fr}.aw>div{overflow:hidden}.aw p{padding:0 22px 20px;color:var(--mut)}
.cta{text-align:center;padding:70px 24px;margin-bottom:90px}.cta h2{margin:0 0 10px}.cta p{color:var(--mut);margin-bottom:26px}
footer{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;padding:30px 4vw;border-top:1px solid var(--bd);color:var(--mut);font-size:14px;background:rgba(5,8,7,.85)}footer a{text-decoration:none;margin-left:18px}footer a:hover{color:var(--tx)}
.pal{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:row-reverse;align-items:center;gap:10px}.pal>button{width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);cursor:pointer;display:grid;place-items:center}.pal>button i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),var(--ac))}
.sw{display:flex;gap:8px;padding:10px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--gl);backdrop-filter:blur(14px);opacity:0;translate:14px 0;pointer-events:none;transition:.25s var(--e)}.pal.o .sw{opacity:1;translate:0;pointer-events:auto}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;transition:scale .2s}.sw button:hover{scale:1.2}.sw .on{border-color:#fff}
.bar2{display:none}
@media(max-width:960px){.hero{grid-template-columns:1fr;gap:40px}.modes{grid-template-columns:repeat(2,1fr)}.bento{grid-template-columns:1fr 1fr}}
@media(max-width:700px){nav,.nv{display:none}.modes,.bento{grid-template-columns:1fr}.feat.wide{grid-column:auto}.bar2{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(5,8,7,.9);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}.bar2 .btn{flex:1}.pal{bottom:84px}footer{padding-bottom:90px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01s!important;transition-duration:.01s!important}}

.btn.s{clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding-right:34px;border-radius:0}.btn.s:hover{box-shadow:none;filter:brightness(1.12)}
.ipbox{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 100%,0 100%);border-radius:0}.feat{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
</style></head><body class="loading"><noscript>Please enable JavaScript to view this site.</noscript>
<script src="config.js"></script>
<script>(()=>{const C=window.SITE,E=C.effects,L=C.links,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],R=document.documentElement.style;
const P={emerald:["#34d399","#f2b45a"],blue:["#3b82f6","#22d3ee"],gold:["#f5b83d","#ff8a3d"],red:["#ef4444","#fb923c"],purple:["#a855f7","#ec4899"],cyan:["#22d3ee","#34d399"],pink:["#ec4899","#f59e0b"],orange:["#fb923c","#facc15"]};
const IC={heart:"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z",globe:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z",coin:"M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",target:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM22 12h-4M6 12H2M12 6V2M12 22v-4",zap:"M13 2L3 14h9l-1 8 10-12h-9l1-8z",shield:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",users:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8",star:"M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z",clock:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2",server:"M2 3h20v8H2zM2 13h20v8H2zM6 7h.01M6 17h.01"};
const ic=n=>`<span class="ic"><svg viewBox="0 0 24 24"><path d="${IC[n]||IC.star}"/></svg></span>`;
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const V={ip:C.java.ip,version:C.java.version,bip:C.bedrock.ip,port:C.bedrock.port};
const theme=n=>{const c=P[n]||P.emerald,o=C.colors||{};R.setProperty("--ac",o.accent||c[0]);R.setProperty("--ac2",o.accent2||c[1]);try{localStorage.setItem("theme",n)}catch(e){}$$(".sw button").forEach(b=>b.classList.toggle("on",b.dataset.n===n))};
document.title=C.name+" | Minecraft Network";document.head.insertAdjacentHTML("beforeend",`<link rel="icon" href="${C.favicon}">`);
const nav=C.nav.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join("")+(L.store?`<a href="${L.store}">Store</a>`:`<a class="soon">Store soon</a>`);
const chars=C.name.split(" ").map((w,wi)=>`<span class="w" aria-hidden="true">${[...w].map((c,i)=>`<span class="ch" style="--i:${wi*5+i}">${c}</span>`).join("")}</span>`).join("");
const card=(c,h)=>`<div class="card sp ${c}">${h}</div>`;
document.body.insertAdjacentHTML("afterbegin",`
<div id="intro"><i class="p p1"></i><i class="p p2"></i><div class="mid"><div class="ring"><img src="${C.logo}" alt="" onerror="this.remove()"></div><div class="pct" id="pct">0%</div><div class="pbar"><i id="pb"></i></div></div></div>
<div id="bg"></div><div class="fog"></div><div class="fog f2"></div><canvas id="fx"></canvas><div id="bolt"></div><div id="shade"></div><div id="cur"></div>
<header><a class="brand" href="#top"><img src="${C.logo}" alt="" onerror="this.remove()"><span>${C.name}</span></a><nav>${nav}</nav><button class="btn nv" data-copy="${V.ip}">${V.ip}</button><a class="btn s nv" href="${L.discord}" target="_blank" rel="noopener">Discord</a></header>
<main id="top"><section class="hero"><div class="in"><div class="pill"><span class="dot" id="dot"></span><span id="st">${C.status.checking}</span></div><h1 aria-label="${C.name}">${chars}</h1><p class="lead">${C.tagline}</p><p class="desc">${C.description}</p>
<div class="ipbox"><code>${V.ip}</code><button class="btn s" data-copy="${V.ip}">Copy IP</button></div><p class="sub">Bedrock: <b data-copy="${V.bip}" data-msg="Copied. Port is ${V.port}">${V.bip}</b> port <b data-copy="${V.port}">${V.port}</b></p>
<div class="row"><a class="btn s" href="#join">How to join</a><a class="btn" href="${L.discord}" target="_blank" rel="noopener">Join Discord</a></div></div>
${card("live tilt",`<div class="lh"><img id="sic" src="${C.logo}" alt="" onerror="this.remove()"><div><div class="num"><b id="pn">0</b><span> / <i id="pm" style="font-style:normal">0</i></span></div><div class="cap">${C.status.online}</div></div></div><div class="cb"><i id="pbar"></i></div><div class="motd" id="motd" hidden></div><div class="who" id="who"></div>`)}</section>
<section class="sec" id="modes"><h2>${C.modes.title}</h2><p class="sh">${C.modes.subtitle}</p><div class="modes">${C.modes.items.map(m=>card("mode",`${ic(m.icon)}<span class="tag">${m.tag}</span><h3>${m.name}</h3><p>${m.desc}</p>`)).join("")}</div></section>
<section class="sec" id="why"><h2>${C.features.title}</h2><p class="sh">${C.features.subtitle}</p><div class="bento">${C.features.items.map(f=>card("feat"+(f.wide?" wide":""),`${ic(f.icon)}<h3>${f.title}</h3><p>${f.text}</p>`)).join("")}</div></section>
<section class="sec" id="join"><h2>${C.join.title}</h2><div class="tabs"><button class="on" data-t="java">Java Edition</button><button data-t="bedrock">Bedrock Edition</button></div><ol id="steps"></ol></section>
